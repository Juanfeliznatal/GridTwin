<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridTwin: Blackout Protocol</title>
    
    <!-- Fonte tecnológica via Google Fonts (Rajdhani e Share Tech Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Link para o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Camada para o efeito visual de flash de raio/tempestade -->
    <div id="lightning-flash" class="lightning-flash"></div>

    <!-- Camada para o fundo animado com linhas de energia -->
    <div class="grid-background"></div>

    <!-- Container principal centralizado -->
    <main class="menu-container">
        
        <!-- Bloco do Título e Subtítulo (Centro da tela) -->
        <header class="title-section">
            <h1 class="main-title">GridTwin: Blackout Protocol</h1>
            <p class="subtitle">Controle o Gêmeo Digital. Preveja. Sobreviva.</p>
        </header>

        <!-- Botão de Ação (Centro-inferior) -->
        <div class="action-section">
            <button id="btn-start" class="btn-start">INICIAR</button>
        </div>

        <!-- Créditos (Canto inferior) -->
        <footer class="credits-section">
            <p>Desenvolvido por: Seu Nome / Sua Equipe</p>
            <p>Disciplina: Nome da Disciplina</p>
        </footer>

    </main>

    <!-- Elemento de áudio para a música de fundo em loop -->
    <audio id="bg-music" loop src="background-music.mp3"></audio>

    <!-- Link para o arquivo de scripts JavaScript -->
    <script src="script.js"></script>
</body>
</html>
